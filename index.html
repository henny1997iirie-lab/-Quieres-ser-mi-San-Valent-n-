<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyce 💐</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #ff6f9f, #8a0030);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(14px);
      padding: 42px 32px;
      border-radius: 28px;
      text-align: center;
      width: 90%;
      max-width: 390px;
      z-index: 2;
      animation: fadeIn 1.2s ease;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 28px;
      opacity: 0.95;
    }

    .lily {
      font-size: 28px;
      margin-bottom: 18px;
      animation: glow 2.5s ease-in-out infinite;
    }

    .buttons {
      position: relative;
      height: 140px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 34px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yesBtn {
      background: #fff;
      color: #8a0030;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    #yesBtn:hover {
      transform: scale(1.12);
    }

    #noBtn {
      background: rgba(255,255,255,0.25);
      color: #fff;
      position: absolute;
      right: 20px;
      top: 70px;
    }

    .message {
      margin-top: 26px;
      font-size: 19px;
      display: none;
      animation: pop 0.6s ease;
    }

    /* Flotantes */
    .float {
      position: fixed;
      bottom: -30px;
      z-index: 1;
      animation: floatUp linear forwards;
      opacity: 0.85;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-115vh);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.4); }
      50% { text-shadow: 0 0 22px rgba(255,255,255,0.9); }
    }
  </style>
</head>

<body>

  <!-- Música romántica -->
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0f8f2f6fa7.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <div class="lily">⚜️🌸⚜️</div>

    <h1>Joyce Herrera</h1>
    <h2>¿Quieres ser mi San Valentín? 💐</h2>

    <div class="buttons">
      <button id="yesBtn">Sí 💖</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="message" id="message">
      💖 Joyce, eres tan especial como un lirio.  
      Gracias por decir que sí 💐
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const message = document.getElementById('message');
    const music = document.getElementById('music');

    // Botón No escapa
    noBtn.addEventListener('mouseenter', () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 80 - 40;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    // Botón Sí
    yesBtn.addEventListener('click', () => {
      message.style.display = 'block';
      yesBtn.style.display = 'none';
      noBtn.style.display = 'none';
      music.play();
    });

    // Corazones y lirios flotando
    setInterval(() => {
      const item = document.createElement('div');
      item.classList.add('float');
      item.innerText = Math.random() > 0.5 ? '💖' : '⚜️';
      item.style.left = Math.random() * 100 + 'vw';
      item.style.fontSize = (Math.random() * 22 + 16) + 'px';
      item.style.animationDuration = (Math.random() * 4 + 5) + 's';
      document.body.appendChild(item);

      setTimeout(() => item.remove(), 9000);
    }, 450);
  </script>

</body>
</html>
